name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python checks
        run: |
          python -m compileall -q server_app tools app web
          python -m pip install pytest -q
          python -m pytest tests -q

      - name: Plugin checks
        working-directory: opencode
        run: |
          npm ci
          npm test
          npm run lint
          npm run pack:check

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
