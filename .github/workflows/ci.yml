name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check (server_app, tools, app)
        run: |
          python -m compileall -q server_app tools app server.py
          echo "python ok"

      - name: Plugin syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node syntax check (opencode plugin)
        run: |
          node --check opencode/plugins/token-metrics.js
          echo "plugin ok"
