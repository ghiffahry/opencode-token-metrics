name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check (server_app, tools, app, web)
        run: |
          python -m compileall -q server_app tools app web
          echo "python ok"

      - name: Python unit tests (server_app)
        run: |
          python -m pip install pytest -q
          python -m pytest tests -q
          echo "tests ok"

      - name: Plugin syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node syntax check (opencode plugin)
        run: |
          node --check opencode/plugins/token-metrics.js
          node --check opencode/plugins/quota.js
          echo "plugin ok"

      - name: Plugin unit + behaviour tests
        working-directory: opencode
        run: |
          npm ci
          npm test
          echo "plugin tests ok"

      - name: Plugin npm pack verification (tarball contents + LICENSE)
        working-directory: opencode
        run: |
          npm run lint
          npm run pack:check
