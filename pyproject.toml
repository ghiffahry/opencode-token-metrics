[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-metrics"
description = "OpenCode API token usage dashboard - local, read-only, WAL-safe"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dynamic = ["version"]
keywords = ["opencode", "tokens", "dashboard", "usage", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=4.0", "Pillow>=9.0"]
build = ["pyinstaller"]

[project.urls]
Homepage = "https://github.com/ghiffahry/token-metrics"
Source = "https://github.com/ghiffahry/token-metrics"

[project.scripts]
token-metrics = "server_app.httpd:main"

[tool.setuptools]
packages = ["server_app"]

[tool.setuptools.dynamic]
version = { attr = "server_app.config.VERSION" }

[tool.setuptools.package-data]
server_app = ["web/*", "web/static/**/*"]
